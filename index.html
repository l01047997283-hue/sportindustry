:root{--ink:#56352f;--muted:#97756d;--pink:#fa669f;--cream:#fff8ec;--line:#f1dfce;--brown:#9d603d;--blue:#72bfe9;--mint:#87d9a3}*{box-sizing:border-box}body{margin:0;background:#f5e7d6;color:var(--ink);font-family:ui-rounded,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--cream);position:relative;box-shadow:0 0 50px #674b3920;padding-bottom:90px}.top{padding:20px 20px 16px;background:linear-gradient(135deg,#ffe4d2,#fff3dd 58%,#ffe5ed);border-bottom:3px solid #f7d4c5}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:33px;filter:drop-shadow(0 4px 2px #b55c4030)}.brand b{font-size:24px;letter-spacing:-1px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#bd806e;font-weight:800}.chip{font-size:10px;border:1px solid #e9b9aa;border-radius:50px;padding:6px 9px;background:#fff9f2;color:#ac6a59;font-weight:800;margin-left:auto}.hero{margin-top:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.hero h1{margin:0;font-size:24px;line-height:1.3;letter-spacing:-1px}.hero p{font-size:12px;color:var(--muted);margin:6px 0 0}.mascot{font-size:66px;transform:rotate(-10deg);filter:drop-shadow(0 8px 0 #c97e6630);animation:bob 2.4s infinite ease-in-out}@keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}main{padding:16px;display:grid;gap:14px}.card{background:#fffdf8;border:2px solid #f1ddcb;border-radius:23px;padding:17px;box-shadow:0 5px 0 #ebd5c5}.card.pink{background:linear-gradient(135deg,#ffecf2,#fff9ed);border-color:#f9b6cb}.card.blue{background:#eefaff;border-color:#c4e8f8}.eyebrow{font-size:11px;font-weight:900;color:#ae7766;letter-spacing:1px;text-transform:uppercase}.h2{font-size:17px;font-weight:950;margin:3px 0 12px}.sub{font-size:12px;color:var(--muted);line-height:1.65}.big{font-size:36px;font-weight:1000;letter-spacing:-1px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border-radius:17px;padding:12px;background:#fff;border:1px solid #f3dfd0}.stat small{display:block;color:#9e7e73;font-size:11px}.stat strong{font-size:19px;display:block;margin-top:4px}.pill{display:inline-block;border-radius:50px;background:#fff;color:#a86b62;padding:5px 10px;font-size:11px;font-weight:900;border:1px solid #e9d1c3}.btn{border:0;border-radius:15px;padding:13px 15px;background:#f969a0;color:#fff;font-weight:950;box-shadow:0 4px 0 #d3477e;transition:transform .1s}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d3477e}.btn.secondary{background:#fff;border:2px solid #e9cdbb;box-shadow:0 3px 0 #ead7c8;color:#7b5142}.btn.dark{background:#8d6046;box-shadow:0 4px 0 #674331}.btn:focus-visible,.nav button:focus-visible{outline:3px solid #5b9edc;outline-offset:2px}.wide{width:100%}.mode{display:block;width:100%;text-align:left;border:2px solid #eed7c8;border-radius:17px;background:#fff;padding:13px;margin:9px 0}.mode.active{border-color:#f7659d;background:#fff0f5;box-shadow:inset 0 0 0 1px #f7659d}.mode strong{font-size:15px}.mode span{display:block;font-size:12px;color:#9b746b;margin-top:4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fffaf2;border-top:2px solid #ecd7c6;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:20}.nav button{background:transparent;border:0;color:#a78a80;font-size:10px;font-weight:900;display:grid;gap:3px;justify-items:center}.nav button span{font-size:22px}.nav button.active{color:#e9578e}.jelly{display:inline-block;font-size:36px;filter:drop-shadow(0 4px 2px #9d627444);transition:transform .2s}.collect{background:linear-gradient(160deg,#c6f2f2,#fff2de 55%,#ffe1ec);border:3px solid #e7c9b9;border-radius:25px;min-height:265px;position:relative;overflow:hidden;padding:12px}.collect:before{content:"";position:absolute;left:-20%;right:-20%;bottom:-60px;height:160px;background:repeating-linear-gradient(90deg,#e6c8a9 0 3px,transparent 3px 80px),repeating-linear-gradient(0deg,#e6c8a9 0 3px,#f8e6cb 3px 56px);transform:perspective(170px) rotateX(35deg);opacity:.75}.collect-header{position:relative;z-index:1;display:flex;justify-content:space-between;font-size:12px;font-weight:900}.drops{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 6px}.drop{border:2px solid #ffffffbb;border-radius:19px;background:#ffffff9c;min-height:80px;font-size:38px;box-shadow:0 5px 0 #ad8d7c45;position:relative}.drop small{display:block;font-size:10px;font-weight:900;color:#885c55}.drop:active{transform:scale(.93)}.pop{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-size:29px;font-weight:1000;color:#e13e83;pointer-events:none;animation:pop .7s forwards}@keyframes pop{to{opacity:0;transform:translate(-50%,-55px)}}.progress{height:12px;background:#f2e3d8;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#ff95b9,#f36c99);border-radius:20px;transition:width .2s}.league{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.league button{border:2px solid #edd7c5;background:#fff;border-radius:12px;padding:11px 2px;font-weight:900;color:#8a6458}.league button.sel{background:#ff77a6;color:#fff;border-color:#ff77a6}.line{padding:12px 0;border-bottom:1px dashed #e9d6c9}.line:last-child{border:0}.item{display:flex;align-items:center;gap:12px;background:#fff8f3;border-radius:16px;padding:11px;margin:8px 0}.item .jelly{width:50px;text-align:center}.item b{font-size:13px}.item small{display:block;color:#a48679;font-size:11px;margin-top:4px}.field{width:100%;border:2px solid #ebd4c5;border-radius:13px;padding:11px;background:white;color:#674b41}.note{background:#fff2d8;border:1px dashed #d8b88c;border-radius:14px;padding:11px;font-size:11px;line-height:1.7;color:#936943}.empty{text-align:center;color:#ad8d81;padding:20px}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#5b3a36;color:#fff;border-radius:30px;padding:12px 20px;font-size:12px;font-weight:800;box-shadow:0 8px 25px #0003;max-width:85%;text-align:center}.hidden{display:none!important}.switch{display:flex;align-items:center;gap:8px}.switch input{accent-color:#ed6597}.tag{font-size:10px;background:#fff0f5;color:#cc5988;border-radius:9px;padding:5px 7px;font-weight:900}.footer{font-size:11px;text-align:center;color:#b08e7f;padding:8px 10px 18px}body.reduce *{animation:none!important;transition:none!important}@media(min-width:650px){.app{margin:20px auto;border-radius:32px;overflow:hidden;min-height:calc(100dvh - 40px)}.nav{bottom:20px;border-radius:0 0 30px 30px}}

</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🍪</div><div><small>SWEET STEPS CLUB</small><b>Jelly Run<span style="color:#f06b9c">.</span></b></div><span class="chip">● DEMO MODE</span></div><div class="hero"><div><h1 id="headtitle">달콤하게, 한 걸음 더!</h1><p id="headsub">오늘의 러닝을 젤리로 채워봐 🍬</p></div><div class="mascot" aria-hidden="true"><img src="assets/pink.png" alt=""></div></div></header><main id="main" aria-live="polite"></main><div class="footer">JELLY RUN · AR SPORTS MEDIA PROTOTYPE v3.0</div><nav class="nav" aria-label="주요 메뉴" id="nav"></nav></div><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const KEY='jellyrun.v3',days=['일','월','화','수','목','금','토'];
const ITEM={pink:{name:'딸기 젤리',emoji:'🩷',point:10,type:'jelly'},blue:{name:'블루베리 젤리',emoji:'🩵',point:20,type:'jelly'},green:{name:'청포도 젤리',emoji:'💚',point:30,type:'jelly'},purple:{name:'포도 젤리',emoji:'💜',point:50,type:'jelly'},silver:{name:'실버 스타 코인',emoji:'🌟',point:40,type:'coin'},gold:{name:'골드 코인',emoji:'🪙',point:100,type:'coin'},magnet:{name:'젤리 자석',emoji:'🧲',point:0,type:'power'},life:{name:'휴식 하트',emoji:'❤️',point:0,type:'power'}};
const keys=Object.keys(ITEM),MODE={free:'Free Jelly Run',challenge:'Challenge Jelly Run',rank:'Rank Jelly Run'};
const TIERS=[{name:'브론즈',pace:540,jelly:15,coin:4},{name:'실버',pace:480,jelly:30,coin:8},{name:'골드',pace:420,jelly:50,coin:12},{name:'다이아',pace:360,jelly:75,coin:20},{name:'그랑프리',pace:330,jelly:100,coin:30}];
function blank(){return {v:3,tab:'home',mode:'free',league:5,leagueWeek:'',tier:0,history:[],settings:{sound:true,motion:true},session:null}};
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));return v&&v.v===3?{...blank(),...v}:blank()}catch{return blank()}}let s=load(),timer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('저장 공간에 접근할 수 없어요')}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function week(d=new Date()){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());let shift=(x.getDay()+6)%7;x.setDate(x.getDate()-shift);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function totals(){let out={score:0,meters:0,seconds:0,jelly:0,coin:0,items:{}};s.history.forEach(h=>{out.score+=h.score;out.meters+=h.meters;out.seconds+=h.seconds;out.jelly+=h.jelly;out.coin+=h.coin;for(let [k,n] of Object.entries(h.items||{}))out.items[k]=(out.items[k]||0)+n});return out}
function time(n){let h=Math.floor(n/3600),m=Math.floor(n%3600/60),sec=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function pace(p){return `${Math.floor(p/60)}′${String(p%60).padStart(2,'0')}″`}
function c(html,extra=''){return `<section class="card ${extra}">${html}</section>`}
function stat(label,value){return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`}
function btn(label,action,style=''){return `<button class="btn ${style}" data-act="${action}">${label}</button>`}
function title(t,sub=''){return `<div class="eyebrow">${sub}</div><div class="h2">${t}</div>`}
function isMonday(){return new Date().getDay()===1}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2400)}
function session(){return s.session}
function demoStats(){let x=session();return x?`${(x.meters/1000).toFixed(2)} km · ${time(x.seconds)} · ${x.score}점`:''}
function sprite(k,cls=''){return `<img class="item-sprite ${cls}" src="assets/${k}.png" alt="${ITEM[k].name}" loading="lazy" draggable="false">`}
function render(){let t=totals();const labels={home:['달콤하게, 한 걸음 더!','오늘의 러닝을 젤리로 채워봐 🍬'],play:['젤리를 모으러 가자!','러닝 콘텐츠 시연 센터'],records:['나의 달콤한 발자국','운동 기록과 수집 기록'],league:['함께 달리면 더 달콤해','거리별 주간 챌린지'],more:['젤리 도감 & 내 정보','수집 현황, 티어, 데이터 관리']};document.getElementById('headtitle').textContent=labels[s.tab][0];document.getElementById('headsub').textContent=labels[s.tab][1];document.getElementById('nav').innerHTML=[['home','🏠','홈'],['play','🍬','플레이'],['records','📒','기록'],['league','🏆','리그'],['more','🐻','마이']].map(([k,e,n])=>`<button data-tab="${k}" class="${s.tab===k?'active':''}" aria-label="${n}" aria-current="${s.tab===k?'page':'false'}"><span>${e}</span>${n}</button>`).join('');let html='';
if(s.tab==='home')html=c(`<div class="row"><div><div class="eyebrow">MY SWEET JOURNEY</div><div class="big">${t.score.toLocaleString()} <span style="font-size:15px">PTS</span></div><div class="sub">모은 달콤한 순간들이 쌓이고 있어!</div></div><span class="home-sprite">${sprite("pink")}</span></div><div class="grid2" style="margin-top:14px">${stat('총 러닝 거리',(t.meters/1000).toFixed(2)+' km')}${stat('완료한 러닝',s.history.length+'회')}${stat('젤리 수집',t.jelly+'개')}${stat('코인 수집',t.coin+'개')}</div>`,'pink')+c(`${title('나에게 맞는 러닝 선택','CHOOSE YOUR FLAVOR')}${Object.entries(MODE).map(([k,v])=>`<button class="mode ${s.mode===k?'active':''}" data-mode="${k}"><strong>${k==='free'?'🍓':k==='challenge'?'🏆':'👑'} ${v}</strong><span>${{free:'제한 없이 자유롭게 젤리 수집',challenge:'거리별 리그에서 주간 점수 경쟁',rank:'페이스와 수집 목표를 달성해 승급'}[k]}</span></button>`).join('')}${btn('🍬 이 모드로 시연 시작','go','wide')}`)+c(`${title('이번 주의 달콤한 도전','WEEKLY SNAPSHOT')}<div class="row"><div><b>${s.league}km 챌린지 리그</b><div class="sub">${week()} 시작 주간 · 월요일 리그 선택</div></div><span class="pill">${s.leagueWeek===week()?'참가 중':'미참가'}</span></div><div class="line"></div><div class="row"><span class="sub">내 주간 점수</span><b>${s.history.filter(h=>h.mode==='challenge'&&week(new Date(h.date))===week()&&h.league===s.league).reduce((a,h)=>a+h.score,0)}점</b></div>`)+`<div class="note">🍪 이 앱은 공모전 발표용 시연입니다. 실제 GPS·AR 글라스·AI 서버 및 다른 이용자의 기록은 연결되어 있지 않습니다.</div>`;
if(s.tab==='play'){let x=session();html=!x?c(`${title('게임 모드 선택','PICK A RUN')}${Object.entries(MODE).map(([k,v])=>`<button class="mode ${s.mode===k?'active':''}" data-mode="${k}"><strong>${k==='free'?'🍓':k==='challenge'?'🏅':'👑'} ${v}</strong><span>${{free:'거리와 페이스 제한 없음',challenge:`${s.league}km 리그 · 주간 누적 점수`,rank:'티어 목표 페이스 + 젤리·코인 목표'}[k]}</span></button>`).join('')}${s.mode==='challenge'?`<div class="note">현재 ${s.league}km 리그 · ${s.leagueWeek===week()?'이번 주 참가 등록됨':'이번 주 참가 등록 필요'}. 리그 선택은 월요일에 확정하는 정책을 시연합니다.</div>`:''}${s.mode==='rank'?`<div class="note">현재 ${TIERS[s.tier].name} · 목표 페이스 ${pace(TIERS[s.tier].pace)}/km 이하 · 젤리 ${TIERS[s.tier].jelly}개 · 코인 ${TIERS[s.tier].coin}개 (시연용 목표치)</div>`:''}${btn('✨ 데모 러닝 시작','start','wide')}`)+c(`${title('시연 안내','HOW TO PLAY')}<div class="sub">실제 도로에서 실행하는 기능이 아닌, 게임 규칙을 검증하기 위한 터치 기반 시뮬레이터입니다. 아이템을 터치해 점수를 얻고, 거리·시간·페이스를 조작해 모드별 결과를 확인할 수 있습니다.</div>`):c(`<div class="row"><div><div class="eyebrow">LIVE DEMO SESSION</div><div class="h2" style="margin-bottom:3px">${MODE[x.mode]}</div></div><span class="pill">${x.paused?'⏸ 일시정지':'● 시연 중'}</span></div><div class="grid2">${stat('거리',(x.meters/1000).toFixed(2)+' km')}${stat('경과 시간',time(x.seconds))}${stat('시연 페이스',pace(x.pace)+'/km')}${stat('수집 점수',x.score+' P')}</div><div class="row" style="margin-top:12px"><span class="pill">🍬 ${x.jelly}개</span><span class="pill">🪙 ${x.coin}개</span><span class="pill">🧲 ${x.magnet}회</span><span class="pill">❤️ ${x.life}회</span></div>`,'pink')+`<section class="collect" aria-label="아이템 수집 시연"><div class="collect-header"><span>🍪 SWEET PATH</span><span>터치해서 수집!</span></div><div class="drops" id="drops">${x.drops.map((k,i)=>`<button class="drop" data-collect="${i}" ${x.paused?'disabled':''} aria-label="${ITEM[k].name} 수집"><span class="sprite-wrap">${sprite(k)}</span><small>+${ITEM[k].point||'POWER'}</small></button>`).join('')}</div></section>`+c(`${title('시연 컨트롤','DEMO CONTROLS')}<div class="grid2">${btn(x.paused?'▶ 재개':'⏸ 일시정지','pause','secondary')}${btn('👟 100m 전진','advance','secondary')}${btn('🧲 자석 사용','magnet','secondary')}${btn('❤️ 휴식 사용','life','secondary')}</div><div style="margin-top:13px"><label class="sub" for="pace">시연 페이스: <b>${pace(x.pace)}/km</b></label><input id="pace" type="range" min="270" max="720" step="15" value="${x.pace}" style="width:100%;accent-color:#ef6d9c"></div><div style="margin-top:14px">${btn('🏁 러닝 종료 · 결과 저장','finish','wide dark')}</div><div class="sub" style="margin-top:12px">시연 중 거리·시간은 실제 GPS가 아닌 조작된 값입니다. 수집 가능한 아이템은 진행 거리에 따라 보충됩니다.</div>`);
}
if(s.tab==='records'){html=c(`${title('누적 운동 기록','RUNNING HISTORY')}<div class="grid2">${stat('총 거리',(t.meters/1000).toFixed(2)+' km')}${stat('총 운동 시간',time(t.seconds))}${stat('수집 점수',t.score.toLocaleString()+' P')}${stat('완료 세션',s.history.length+'회')}</div>`)+c(`${title('세션별 기록','ACTIVITY LOG')}${s.history.length?s.history.map((h,i)=>`<div class="line"><div class="row"><b>${h.mode==='free'?'🍓':h.mode==='challenge'?'🏆':'👑'} ${MODE[h.mode]}</b><span class="tag">+${h.score} P</span></div><div class="sub">${new Date(h.date).toLocaleString('ko-KR')} · ${(h.meters/1000).toFixed(2)}km · ${time(h.seconds)}</div><div class="sub">🍬 ${h.jelly} · 🪙 ${h.coin} · 페이스 ${pace(h.pace)}/km</div>${h.mode==='rank'?`<div class="sub">${h.rankPassed?'✨ 승급 조건 달성':'🔒 승급 조건 미달'}</div>`:''}</div>`).join(''):'<div class="empty">아직 저장된 러닝이 없어요.<br>플레이 탭에서 첫 젤리를 모아봐!</div>'}`)};
if(s.tab==='league'){let w=week(),joined=s.leagueWeek===w;let own=s.history.filter(h=>h.mode==='challenge'&&week(new Date(h.date))===w&&h.league===s.league).reduce((a,h)=>a+h.score,0);let samples=[{name:'쿠키러너',score:1240},{name:'젤리곰',score:970},{name:'달콤발걸음',score:650},{name:'나',score:own}].sort((a,b)=>b.score-a.score);html=c(`${title('Challenge Jelly Run','WEEKLY LEAGUE')}<div class="sub">제안서 기준: 월요일에 거리별 리그 선택, 자유로운 코스에서 아이템 수집, 주간 점수 누적 경쟁.</div><div class="league" style="margin-top:13px">${[5,10,15,20,25].map(n=>`<button data-league="${n}" class="${s.league===n?'sel':''}" ${joined?'disabled':''}>${n}km</button>`).join('')}</div><div class="sub" style="margin-top:10px">이번 주 시작: ${w} (월요일)</div><div style="margin-top:13px">${joined?'<span class="pill">✓ 이번 주 참가 등록됨</span>':btn('🏁 이번 주 리그 등록','join','wide')}</div><div class="note" style="margin-top:12px">발표 시연을 위해 요일과 무관하게 등록할 수 있습니다. 실제 서비스에서는 월요일 확정 정책을 서버에서 검증해야 합니다.</div>`)+c(`${title(`${s.league}km 리그 순위표`,'DEMO LEADERBOARD')}<div class="sub">다른 러너의 점수는 가상 데이터이며 실시간 순위가 아닙니다.</div>${samples.map((r,i)=>`<div class="line row" style="${r.name==='나'?'color:#dd4f87;font-weight:900':''}"><span>${['🥇','🥈','🥉','🎽'][i]} ${esc(r.name)}</span><b>${r.score.toLocaleString()} P</b></div>`).join('')}`)+c(`${title('공정한 경쟁 구조','FAIR PLAY')}<div class="sub">단위 거리당 아이템 생성량을 동일하게 유지하고, 수집 이벤트·거리·페이스를 서버에서 검증하도록 설계합니다. 현재 시연은 생성 규칙만 단순화해 구현했습니다.</div>`)}
if(s.tab==='more'){let tier=TIERS[s.tier],progress=Math.min(100,Math.round((t.jelly/tier.jelly+t.coin/tier.coin)/2*100));html=c(`${title('Rank Jelly Run','RANK JOURNEY')}<div class="row"><div><div class="eyebrow">CURRENT TIER</div><div class="big" style="font-size:29px">${['🥉','🥈','🥇','💎','👑'][s.tier]} ${tier.name}</div></div><span style="font-size:58px">👑</span></div><div class="sub">승급은 해당 티어의 단일 러닝에서 페이스와 수집 목표를 모두 달성해야 합니다.</div><div class="grid2" style="margin-top:12px">${stat('목표 페이스',pace(tier.pace)+'/km')}${stat('젤리·코인 목표',`${tier.jelly} · ${tier.coin}`)}</div><div class="note" style="margin-top:12px">위 목표치는 제안서에 구체적 수치가 없어 **시연용으로 설정한 값**입니다. 실제 서비스에서는 실증 연구를 통해 조정해야 합니다.</div>`,'pink')+c(`${title('젤리 컬렉션','SWEET COLLECTION')}${keys.map(k=>`<div class="item"><span class="jelly">${["pink","blue","green","purple","silver","gold"].includes(k)?sprite(k):ITEM[k].emoji}</span><div style="flex:1"><b>${ITEM[k].name}</b><small>${ITEM[k].point?`수집 시 +${ITEM[k].point}점`:'시연 중 사용 가능한 특수 아이템'}</small></div><b>${t.items[k]||0}개</b></div>`).join('')}`)+c(`${title('앱 설정 및 기록 관리','SETTINGS')}<label class="switch"><input type="checkbox" id="sound" ${s.settings.sound?'checked':''}> 수집 효과음</label><div class="line"></div><label class="switch"><input type="checkbox" id="motion" ${s.settings.motion?'checked':''}> 움직임 애니메이션</label><div class="line"></div><div class="grid2">${btn('⬇ JSON 백업','export','secondary')}${btn('⬆ 백업 복원','import','secondary')}</div><input type="file" id="fileinput" accept="application/json,.json" class="hidden"><div style="margin-top:12px">${btn('기록 전체 초기화','reset','wide secondary')}</div><div class="sub" style="margin-top:12px">기록은 현재 기기의 브라우저에만 저장됩니다. 백업 파일로 이동할 수 있으며 서버 동기화는 지원하지 않습니다.</div>`)}document.getElementById('main').innerHTML=html;document.body.classList.toggle('reduce',!s.settings.motion);}
function begin(){if(s.session){toast('진행 중인 러닝이 있어요');return}let x={mode:s.mode,league:s.league,date:new Date().toISOString(),meters:0,seconds:0,pace:420,score:0,jelly:0,coin:0,magnet:0,life:0,items:{},paused:false,drops:['pink','blue','green','silver','gold','purple'],step:0};s.session=x;save();render();toast('젤리런 시연 시작! 🍬')}
function addItem(k,rerender=true){let x=session();if(!x||x.paused)return;let o=ITEM[k];x.items[k]=(x.items[k]||0)+1;if(o.type==='jelly')x.jelly++;if(o.type==='coin')x.coin++;if(k==='magnet')x.magnet++;if(k==='life')x.life++;x.score+=o.point;if(s.settings.sound)beep(o.type==='coin'?740:520);save();if(rerender)render()}
function beep(f){try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.035,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start();o.stop(a.currentTime+.13);o.onended=()=>a.close()}catch{}}
function advance(){let x=session();if(!x||x.paused)return;x.meters+=100;x.seconds+=Math.round(x.pace/10);x.step++;if(x.step%4===0)x.drops=['pink','green','gold','blue','silver','purple'];save();render();toast('+100m 시연 이동')}
function finish(){let x=session();if(!x)return;if(!confirm('러닝을 종료하고 기록을 저장할까요?'))return;let goal=TIERS[s.tier];let pass=x.mode==='rank'&&x.meters>=1000&&x.pace<=goal.pace&&x.jelly>=goal.jelly&&x.coin>=goal.coin;let record={...x,rankPassed:pass};delete record.drops;delete record.paused;delete record.step;s.history.unshift(record);if(pass&&s.tier<TIERS.length-1)s.tier++;s.session=null;s.tab='records';save();render();toast(pass?'🎉 승급 조건 달성! 기록 저장 완료':'🏁 러닝 기록 저장 완료')}
function join(){if(s.leagueWeek===week()){toast('이미 참가 중이에요');return}s.leagueWeek=week();save();render();toast(`${s.league}km 리그에 참가했어요!`)}
function backup(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data:s},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jelly-run-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result),d=v.data;if(!d||d.v!==3||!Array.isArray(d.history)||!d.settings)throw Error('형식 오류');if(!confirm('현재 기록을 백업 파일로 교체할까요?'))return;s={...blank(),...d,tab:'more'};save();render();toast('백업 복원 완료')}catch{toast('올바른 Jelly Run v3 백업이 아니에요')}};r.readAsText(file)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){s.tab=b.dataset.tab;save();render();window.scrollTo(0,0);return}if(b.dataset.mode){if(s.session){toast('진행 중에는 모드를 바꿀 수 없어요');return}s.mode=b.dataset.mode;save();render();return}if(b.dataset.league){s.league=+b.dataset.league;save();render();return}if(b.dataset.collect!==undefined){let x=session();if(!x||x.paused)return;let i=+b.dataset.collect,k=x.drops[i];addItem(k,false);x.drops[i]=keys[(x.step+i+x.jelly+x.coin)%6];save();render();toast(`${ITEM[k].emoji} ${ITEM[k].name} +${ITEM[k].point}점`);return}let a=b.dataset.act;if(!a)return;switch(a){case 'go':s.tab='play';save();render();break;case 'start':begin();break;case 'pause':if(session()){session().paused=!session().paused;save();render()}break;case 'advance':advance();break;case 'magnet':if(session()&&!session().paused){addItem('magnet',false);['pink','blue','green'].forEach(k=>addItem(k,false));render();toast('🧲 주변 젤리 자동 수집!')}break;case 'life':if(session()&&!session().paused){addItem('life');toast('❤️ 휴식 아이템 획득!')}break;case 'finish':finish();break;case 'join':join();break;case 'export':backup();break;case 'import':document.getElementById('fileinput').click();break;case 'reset':if(confirm('모든 러닝 기록과 설정을 초기화할까요? 되돌릴 수 없습니다.')){s=blank();save();render();toast('초기화 완료')}break;}});
document.addEventListener('input',e=>{if(e.target.id==='pace'&&session()){session().pace=+e.target.value;save();let l=e.target.parentElement.querySelector('b');if(l)l.textContent=pace(session().pace)+'/km'}});
document.addEventListener('change',e=>{if(e.target.id==='sound'||e.target.id==='motion'){s.settings[e.target.id]=e.target.checked;save();render()}if(e.target.id==='fileinput')restore(e.target.files[0])});
setInterval(()=>{if(session()&&!session().paused){session().seconds++;save();if(s.tab==='play'){let x=document.getElementById('main');if(x){let st=x.querySelectorAll('.stat strong');if(st.length>1)st[1].textContent=time(session().seconds)}}}},1000);
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
